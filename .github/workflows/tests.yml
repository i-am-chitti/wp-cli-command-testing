name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  WP_CLI_TEST_DBHOST: 127.0.0.1
  WP_CLI_TEST_DBROOTUSER: root
  WP_CLI_TEST_DBROOTPASS: root
  WP_CLI_TEST_DBUSER: wp_cli_test
  WP_CLI_TEST_DBPASS: password1
  WP_CLI_TEST_DBNAME: wp_cli_test
  # Behat reads this to pick the WordPress it downloads. PHPUnit's copy comes
  # from roots/wordpress in composer.json — keep the two in step.
  WP_VERSION: '7.1'
  # WordPress 7.x archives don't extract under PHP CLI's default 128M.
  WP_CLI_PHP_ARGS: '-d memory_limit=512M'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction

      - run: composer prepare-tests

      - run: composer test

      - run: composer behat
